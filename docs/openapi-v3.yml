openapi: 3.1.0
info:
  title: Talaria V3 entity projections
  version: 1.0.0
paths:
  /api/v1/entities/{entity_id}/overview:
    parameters:
      - $ref: '#/components/parameters/Entity'
    get:
      responses:
        '200':
          description: Stored identity and canonical occurrence statistics
          content:
            application/json:
              schema:
                type: object
                required: [entity, stats, time_bounds]
                properties:
                  entity:
                    type: object
                    required: [id, label, qid]
                    properties:
                      id: {type: string, format: uuid}
                      label: {type: string}
                      qid: {type: [string, 'null']}
                  stats:
                    type: object
                    required: [timeline_events, mapped_events, places]
                    properties:
                      timeline_events: {type: integer}
                      mapped_events: {type: integer}
                      places: {type: integer, description: Distinct stored location labels}
                  time_bounds:
                    type: object
                    required: [from, to]
                    properties:
                      from: {type: [integer, 'null']}
                      to: {type: [integer, 'null']}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/entities/{entity_id}/timeline:
    parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Types'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Language'
      - name: resolution
        in: query
        schema: {type: string, enum: [overview, period, detail], default: detail}
    get:
      responses:
        '200':
          description: Chronological page; approximate/range/unknown semantics retained
          content:
            application/json:
              schema:
                type: object
                required: [events, count, pagination]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/Event'}
                  count: {type: integer}
                  pagination: {$ref: '#/components/schemas/Pagination'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/entities/{entity_id}/events:
    parameters:
      - $ref: '#/components/parameters/Entity'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Types'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Language'
      - name: bbox
        in: query
        description: west,south,east,north in EPSG4326; antimeridian crossing unsupported
        schema: {type: string, example: '-5,42,9,51'}
    get:
      responses:
        '200':
          description: GeoJSON page of eligible sourced points
          content:
            application/json:
              schema:
                type: object
                required: [type, features, pagination]
                properties:
                  type: {type: string, const: FeatureCollection}
                  features:
                    type: array
                    items:
                      type: object
                      required: [type, id, geometry, properties]
                      properties:
                        type: {type: string, const: Feature}
                        id: {type: string, format: uuid}
                        geometry:
                          type: object
                          properties:
                            type: {type: string, const: Point}
                            coordinates:
                              type: array
                              minItems: 2
                              maxItems: 2
                              items: {type: number}
                        properties: {$ref: '#/components/schemas/Event'}
                  pagination: {$ref: '#/components/schemas/Pagination'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/entities/{entity_id}/bibliography:
    parameters:
      - $ref: '#/components/parameters/Entity'
      - in: query
        name: providers
        schema: {type: string}
        description: Comma-separated database identifiers; applied before cursor pagination.
      - in: query
        name: relation
        schema: {type: string, enum: [about, by, mentioned_in], default: about}
      - in: query
        name: cursor
        schema: {type: string}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    get:
      responses:
        '200':
          description: Bibliographic resources, page cursor and complete provider facets for the selected relation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
                  next_cursor: {type: [string, 'null']}
                  providers:
                    type: array
                    items:
                      type: object
                      required: [name, count]
                      properties:
                        name: {type: string}
                        count: {type: integer}
        '500': {$ref: '#/components/responses/Error'}

  /api/v1/interactions:
    post:
      summary: Create or upsert a stateful Talaria interaction
      description: |
        Session cookie required. `user_id` is taken from the session, never the body.
        Idempotent for non-stance actions: first insert returns 201, duplicate returns 200 with the same row.
        Claim stances (support/dispute/uncertain) replace transactionally so exactly one stance remains.
        No Intuition fields (tx_hash, term_id, intuition_status).
        source target v1 = corpus_documents.id (Scholar corpus document).
        route is not supported (Visit has no durable itinerary UUID; TODO PR8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionEnvelope'
        '200':
          description: Existing row returned (idempotent upsert)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionEnvelope'
        '400': {$ref: '#/components/responses/StructuredError'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
        '500': {$ref: '#/components/responses/StructuredError'}
  /api/v1/interactions/{id}:
    delete:
      summary: Delete an interaction owned by the session user
      description: Foreign ids return 404 (no existence leak).
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
        '500': {$ref: '#/components/responses/StructuredError'}
  /api/v1/me/interactions:
    get:
      summary: List the session user's interactions (cursor pagination)
      parameters:
        - name: action
          in: query
          schema: {$ref: '#/components/schemas/InteractionAction'}
        - name: target_type
          in: query
          schema: {$ref: '#/components/schemas/InteractionTargetType'}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Interaction'}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/StructuredError'}
        '400': {$ref: '#/components/responses/StructuredError'}
  /api/v1/interactions/summary:
    get:
      summary: Batch public interaction counts (max 100 ids, one grouped query)
      description: |
        Public, no auth required. `counts` include only visibility=public.
        `mine` is empty for anonymous callers; authenticated callers see their rows including private.
      parameters:
        - name: target_type
          in: query
          required: true
          schema: {$ref: '#/components/schemas/InteractionTargetType'}
        - name: target_ids
          in: query
          required: true
          description: Comma-separated UUIDs, max 100
          schema: {type: string}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [summaries]
                properties:
                  summaries:
                    type: array
                    items: {$ref: '#/components/schemas/InteractionSummary'}
        '400': {$ref: '#/components/responses/StructuredError'}

  /api/v1/claims/{claim_id}/intuition:
    get:
      summary: Intuition readiness for a soft claim
      description: |
        Read-only. ready means a published triple termId exists.
        counter_term_id is resolved on the client via MultiVault getInverseTripleId.
        Does not create triples.
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ready, not_published]}
                  claim_id: {type: string, format: uuid}
                  chain_id: {type: integer}
                  triple_term_id: {type: string}
                  counter_term_id: {type: [string, 'null']}
        '404': {$ref: '#/components/responses/StructuredError'}
  /api/v1/claims/{claim_id}/signals/sync:
    post:
      summary: Verify a user-signed MultiVault deposit and persist Talaria stance
      description: |
        Session required. Backend verifies receipt, MultiVault, receiver wallet, and termId.
        Idempotent on tx_hash. Uncertain is not accepted here.
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, tx_hash]
              properties:
                action: {type: string, enum: [support, dispute]}
                tx_hash: {type: string}
      responses:
        '200':
          description: Existing tx already synced
        '201':
          description: Stance created after verified deposit
        '400': {$ref: '#/components/responses/StructuredError'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
        '409': {$ref: '#/components/responses/StructuredError'}

  /api/v1/claims/{claim_id}/comments:
    get:
      summary: List Agora comments for a claim
      description: |
        Public. Roots newest first. Replies oldest first, max 20 per root.
        Deleted comments keep their place; body is omitted. Off-chain only.
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, default: 20, maximum: 50}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Comment'}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
    post:
      summary: Create a root comment or a single-level reply
      description: Session required. parent_comment_id must be a root of this claim.
      parameters:
        - name: claim_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 4000}
                parent_comment_id: {type: [string, 'null'], format: uuid}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: {$ref: '#/components/schemas/Comment'}
        '400': {$ref: '#/components/responses/StructuredError'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
  /api/v1/comments/{comment_id}:
    patch:
      summary: Edit own active comment
      description: Foreign ownership returns comment_not_found.
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: {type: string, minLength: 1, maxLength: 4000}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: {$ref: '#/components/schemas/Comment'}
        '400': {$ref: '#/components/responses/StructuredError'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
    delete:
      summary: Soft-delete own comment
      description: status=deleted; replies remain; body omitted from public DTO.
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: {$ref: '#/components/schemas/Comment'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
  /api/v1/comments/{comment_id}/reactions:
    post:
      summary: Add a semantic reaction (Talaria-only, not an Intuition signal)
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction_type]
              properties:
                reaction_type: {$ref: '#/components/schemas/CommentReactionType'}
      responses:
        '200':
          description: Already present (idempotent)
        '201':
          description: Created
        '400': {$ref: '#/components/responses/StructuredError'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}
  /api/v1/comments/{comment_id}/reactions/{reaction_type}:
    delete:
      summary: Remove own semantic reaction
      parameters:
        - name: comment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: reaction_type
          in: path
          required: true
          schema: {$ref: '#/components/schemas/CommentReactionType'}
      responses:
        '200':
          description: Comment with updated counts
        '400': {$ref: '#/components/responses/StructuredError'}
        '401': {$ref: '#/components/responses/StructuredError'}
        '404': {$ref: '#/components/responses/StructuredError'}

components:
  parameters:
    Entity:
      name: entity_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    From:
      name: from
      in: query
      schema: {type: integer, minimum: -9999, maximum: 9999}
    To:
      name: to
      in: query
      schema: {type: integer, minimum: -9999, maximum: 9999}
    Types:
      name: types
      in: query
      description: Comma-separated stored event types, at most 32
      schema: {type: string}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor bound to entity, filters, view and resolution
      schema: {type: string, maxLength: 8192}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 200}
    Language:
      name: lang
      in: query
      schema: {type: string, enum: [en, fr]}
  responses:
    Error:
      description: Explicit validation, not-found or storage error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
    StructuredError:
      description: Code + message, never raw SQL
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    enum:
                      - unauthenticated
                      - invalid_action
                      - invalid_target_type
                      - invalid_action_for_target
                      - target_not_found
                      - interaction_not_found
                      - invalid_visibility
                      - batch_too_large
                      - database_error
                      - invalid_address
                      - conflict
                      - expired_challenge
                      - invalid_signature
                  message: {type: string}
  schemas:
    InteractionAction:
      type: string
      enum:
        - interest
        - follow
        - save
        - support
        - dispute
        - uncertain
        - useful
        - credible
        - not_credible
        - want_to_visit
        - visited
    InteractionTargetType:
      type: string
      enum: [person, claim, source, place, event]
      description: route is omitted until Visit has a durable UUID (PR8)
    InteractionVisibility:
      type: string
      enum: [private, public]
    InteractionCreate:
      type: object
      required: [action, target_type, target_id]
      properties:
        action: {$ref: '#/components/schemas/InteractionAction'}
        target_type: {$ref: '#/components/schemas/InteractionTargetType'}
        target_id: {type: string, format: uuid}
        visibility: {$ref: '#/components/schemas/InteractionVisibility'}
      description: |
        Visibility defaults: save/follow/interest/visited/want_to_visit=private;
        support/dispute/uncertain/useful/credible/not_credible=public.
        Never send user_id or wallet_address.
    Interaction:
      type: object
      required: [id, action, target_type, target_id, visibility, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        action: {$ref: '#/components/schemas/InteractionAction'}
        target_type: {$ref: '#/components/schemas/InteractionTargetType'}
        target_id: {type: string, format: uuid}
        visibility: {$ref: '#/components/schemas/InteractionVisibility'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    InteractionEnvelope:
      type: object
      required: [interaction]
      properties:
        interaction: {$ref: '#/components/schemas/Interaction'}
    InteractionSummary:
      type: object
      required: [target_id, counts, comment_count, mine]
      properties:
        target_id: {type: string, format: uuid}
        counts:
          type: object
          additionalProperties: {type: integer}
        comment_count: {type: integer}
        mine:
          type: array
          items: {$ref: '#/components/schemas/InteractionAction'}
    CommentReactionType:
      type: string
      enum: [relevant, well_sourced, interesting, needs_nuance, disagree]
    Comment:
      type: object
      required: [id, claim_id, author, status, created_at, reactions, my_reactions]
      properties:
        id: {type: string, format: uuid}
        claim_id: {type: string, format: uuid}
        author:
          type: object
          required: [id, display_name]
          properties:
            id: {type: string, format: uuid}
            display_name: {type: [string, 'null']}
        body: {type: [string, 'null']}
        status: {type: string, enum: [active, deleted]}
        edited_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        reactions:
          type: object
          additionalProperties: {type: integer}
        my_reactions:
          type: array
          items: {$ref: '#/components/schemas/CommentReactionType'}
        replies:
          type: array
          items: {$ref: '#/components/schemas/Comment'}
        reply_count: {type: integer}
    Pagination:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: {type: [string, 'null']}
    Event:
      type: object
      required: [id, entity_id, person, event_type, epistemic_status, title, time, map_eligible]
      properties:
        id: {type: string, format: uuid}
        entity_id: {type: string, format: uuid}
        person: {type: string}
        event_type: {type: string}
        epistemic_status: {type: string}
        title: {type: string}
        start_time: {type: [string, 'null'], format: date-time}
        place_label: {type: [string, 'null']}
        map_eligible: {type: boolean}
        coordinates:
          type: [object, 'null']
          properties:
            lat: {type: number}
            lon: {type: number}
        time:
          type: object
          properties:
            kind: {type: string, enum: [exact, range, approx, unknown]}
            precision: {type: string, enum: [day, month, year]}
            start: {type: [string, 'null']}
            end: {type: [string, 'null']}
            surface: {type: [string, 'null']}
