[package]
name = "talaria-api"
version.workspace = true
edition.workspace = true
description = "HTTP API and CLI for Talaria Engine"
default-run = "talaria"

[[bin]]
name = "talaria"
path = "src/main.rs"

[dependencies]
talaria-ai = { path = "../talaria-ai" }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
talaria-core = { path = "../talaria-core" }
talaria-dump = { path = "../talaria-dump" }
talaria-cosmos = { path = "../talaria-cosmos" }
talaria-wikidata = { path = "../talaria-wikidata" }
talaria-judge = { path = "../talaria-judge" }
talaria-quality = { path = "../talaria-quality" }
talaria-sources = { path = "../talaria-sources" }
talaria-intuition = { path = "../talaria-intuition" }
talaria-store = { path = "../talaria-store" }
talaria-text = { path = "../talaria-text" }
tokio = { workspace = true }
uuid = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
siwe = "0.6.1"
rand = "0.10.3"
time = "0.3"
alloy-primitives = "1"
async-trait = { workspace = true }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
alloy-signer = "2.5.0"
alloy-signer-local = "2.5.0"
tempfile = "3"
