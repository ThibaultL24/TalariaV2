talaria-sources = { path = "../talaria-sources" }
talaria-intuition = { path = "../talaria-intuition" }
talaria-store = { path = "../talaria-store" }
talaria-text = { path = "../talaria-text" }
tokio = { workspace = true }
uuid = { workspace = true }
