name: Talaria V3
on:
  push:
    branches: [V3, main]
  # Include stacked PRs (UX/SNAC) whose base is not main.
  pull_request:
  workflow_dispatch:
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed build and dependency caches
        shell: bash
        run: |
          tracked="$(git ls-files -- 'node_modules/**' 'web/node_modules/**' 'web/dist/**' 'target/**')"
          if [ -n "$tracked" ]; then
            printf '%s\n' "::error::Generated artifacts are tracked in Git:" "$tracked"
            exit 1
          fi
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talaria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/talaria_test
      TALARIA_OFFLINE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p talaria-ai
      - run: cargo test -p talaria-api routes::documents
      - run: cargo test -p talaria-api routes::entity_views
      - run: cargo test -p talaria-api routes::entities
      - run: cargo test -p talaria-api person_ingest::corpus_evidence
      - run: cargo test -p talaria-api routes::visit_wikidata
      - run: cargo test -p talaria-store admin_ingest
      - run: cargo test -p talaria-api routes::admin_ingest
      - run: cargo test -p talaria-store ingest_jobs
      - run: cargo test -p talaria-store ingest_provider_checkpoints
      - run: cargo test -p talaria-store ingest_provider_metrics
      - run: cargo test -p talaria-api routes::ingest
      - run: cargo test -p talaria-api corpus_ingest::tests
      - run: cargo test -p talaria-quality
      - run: cargo test -p talaria-sources
      - run: cargo test -p talaria-api routes::landmarks
      - run: cargo clippy -p talaria-ai -p talaria-api --all-targets
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
