# PostgreSQL + PostGIS for talaria-engine (local dev).
# Dumps live on external disk via TALARIA_DATA_ROOT — not in this volume.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talaria_engine_development
    ports:
      - "5433:5432"
    volumes:
      - talaria_pg_data:/var/lib/postgresql/data

volumes:
  talaria_pg_data:
